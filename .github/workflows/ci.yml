name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trote
          POSTGRES_PASSWORD: trote
          POSTGRES_DB: armazem
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U trote -d armazem"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL: postgres://trote:trote@localhost:5434/armazem
      DATABASE_URL_DIRECT: postgres://trote:trote@localhost:5434/armazem
      TEST_DATABASE_URL: postgres://trote:trote@localhost:5434/armazem_test
      TEST_REDIS_URL: redis://localhost:6380/1
      REDIS_URL: redis://localhost:6380
      CART_COOKIE_SECRET: ci-only-cookie-secret-not-used-anywhere-else
      ADMIN_API_TOKEN: ci-only-admin-token-not-used-anywhere-else-000
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - name: Migrate and seed (smaller catalog keeps CI fast)
        run: pnpm db:migrate && pnpm db:seed --products 2000
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (desktop + mobile)
        run: pnpm test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
